name: CI

on:
  push:
    branches: [main, opencode-v2]
  pull_request:
    branches: [main, opencode-v2]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.1
      - uses: actions/setup-node@v6.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check committed build
        run: git diff --exit-code -- dist
